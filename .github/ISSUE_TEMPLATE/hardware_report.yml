name: Отчёт о железе
description: Ваша ревизия платы — присылайте, даже если всё заработало
title: "[HW] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        **Это самый ценный тип отчёта.** Сборка проверялась на одном-единственном экземпляре
        устройства, и часть решений опирается на особенности именно той платы. Подтверждение
        «у меня всё так же» — полноценный результат, он говорит, что порт не привязан к
        одному экземпляру.

        Заполнять имеет смысл и когда всё работает, и когда не работает.

  - type: dropdown
    id: outcome
    attributes:
      label: Общий итог
      options:
        - Всё работает как описано
        - Работает, но есть отличия
        - Не работает
    validations:
      required: true

  - type: textarea
    id: radio-init
    attributes:
      label: Строки инициализации радио
      description: |
        Вывод команды:
        `dmesg | grep -iE "PHY_REG_PG|Bonding|RFE type|chip_version"`

        На проверенном экземпляре: Bonding Type 97FS PKG1, RFE type 1, PHY_REG_PG_8197Fmp_Type1,
        chip_version=0x100a. **Любое расхождение здесь критично.**
      render: text
    validations:
      required: true

  - type: textarea
    id: switch-ports
    attributes:
      label: Разметка портов свитча
      description: "`dmesg | grep -E \"eth[01] added\"` — ожидается 0x10f и 0x110"
      render: text
    validations:
      required: false

  - type: textarea
    id: mac
    attributes:
      label: MAC-адреса
      description: >
        `dmesg | grep hwsetting` и `ip link show eth0`. Совпадает ли адрес с наклейкой на
        устройстве? Если показан 00:12:34:56:78:96 — чтение из флеша не сработало.
      render: text
    validations:
      required: true

  - type: input
    id: board-rev
    attributes:
      label: Ревизия платы
      description: Если на самой плате есть маркировка — перепишите её.
    validations:
      required: false

  - type: input
    id: stock-version
    attributes:
      label: Версия заводской прошивки
      description: Из веб-интерфейса стока, до экспериментов.
    validations:
      required: false

  - type: input
    id: region
    attributes:
      label: Регион покупки и оператор
    validations:
      required: false

  - type: textarea
    id: wifi
    attributes:
      label: Как повёл себя Wi-Fi 2,4 ГГц
      description: >
        Видна ли сеть, подключается ли клиент, выдаётся ли адрес, держится ли связь,
        какая примерно скорость и дальнобойность в сравнении со стоком.
    validations:
      required: false

  - type: textarea
    id: uart-log
    attributes:
      label: Лог UART с момента подачи питания
      description: Файл из `tools/ram-boot-logs/`, текстом.
      render: text
    validations:
      required: false
