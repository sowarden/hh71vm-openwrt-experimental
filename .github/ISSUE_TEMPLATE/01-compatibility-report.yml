name: Hardware compatibility report
description: Report any HH71/HH71VM test, including a complete success
title: "[Compatibility] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Successful reports are just as important as failures.

        Follow the [testing guide](https://github.com/sowarden/hh71vm-openwrt-experimental/blob/main/docs/testing.md) and attach the complete UART log from `tools/ram-boot-logs/`.

        **Privacy:** review every file before posting. Redact full MAC addresses, serial numbers, IMEI/IMSI, SIM data, phone numbers, messages, credentials, and keys.

  - type: dropdown
    id: outcome
    attributes:
      label: Overall result
      options:
        - Booted and worked as documented
        - Booted with hardware or behavior differences
        - Failed before OpenWrt finished booting
        - OpenWrt booted but networking failed
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Exact marketed model
      description: Copy the model name, but not the serial number, from the label.
      placeholder: Alcatel LINKHUB HH71VM
    validations:
      required: true

  - type: input
    id: board-revision
    attributes:
      label: PCB or board revision
      description: Copy visible PCB markings. Do not include a device serial number.
      placeholder: Not visible / exact marking
    validations:
      required: true

  - type: input
    id: region-carrier
    attributes:
      label: Purchase region and carrier branding
      placeholder: Country, unbranded or carrier name
    validations:
      required: true

  - type: input
    id: stock-version
    attributes:
      label: Stock firmware version
      description: Record this before RAM booting.
    validations:
      required: true

  - type: input
    id: image-sha256
    attributes:
      label: RAM image SHA-256
      value: 4d4a329edbe034e431a12f4f57aa8c46c4f4fe51a4d1d161a852b6a9134691f7
    validations:
      required: true

  - type: textarea
    id: host-setup
    attributes:
      label: Test host and UART setup
      description: Host OS/version, Python version, USB-UART adapter, serial port, and wiring notes.
      placeholder: |
        Host OS:
        Python:
        USB-UART adapter:
        Serial port:
    validations:
      required: true

  - type: textarea
    id: uart-log
    attributes:
      label: Complete sanitized UART log
      description: Drag the text log from tools/ram-boot-logs/ into this field. Do not upload screenshots of text.
      placeholder: Attach the sanitized .log file here.
    validations:
      required: true

  - type: textarea
    id: radio-markers
    attributes:
      label: Radio and SoC markers
      description: Output of dmesg | grep -iE "PHY_REG_PG|Bonding|RFE type|chip_version", if a shell was reached.
      render: text
    validations:
      required: false

  - type: textarea
    id: switch-mac
    attributes:
      label: Switch mapping and MAC result
      description: Include the eth0/eth1 member masks and state whether eth0 matched the label. Redact unique MAC bytes.
      placeholder: |
        eth0 member mask:
        eth1 member mask:
        eth0 MAC matched label: yes/no/not reached
    validations:
      required: false

  - type: dropdown
    id: ethernet
    attributes:
      label: Ethernet result
      options:
        - Not reached or not tested
        - Link, DHCP, and traffic worked
        - Link worked but DHCP or traffic failed
        - No link
    validations:
      required: true

  - type: dropdown
    id: wifi-24
    attributes:
      label: 2.4 GHz Wi-Fi result
      options:
        - Not reached or not tested
        - SSID, association, DHCP, and traffic worked
        - SSID visible but association or traffic failed
        - SSID not visible
    validations:
      required: true

  - type: dropdown
    id: wifi-5
    attributes:
      label: 5 GHz Wi-Fi result
      options:
        - Not reached or not tested
        - SSID, association, DHCP, and traffic worked
        - SSID visible but association or traffic failed
        - SSID not visible
    validations:
      required: true

  - type: dropdown
    id: modem
    attributes:
      label: Qualcomm modem and mobile Internet result
      options:
        - Not reached or not tested
        - RNDIS, modem status, and mobile Internet worked
        - RNDIS appeared but modem control or Internet failed
        - No RNDIS eth2 interface
    validations:
      required: true

  - type: textarea
    id: differences
    attributes:
      label: Differences, failures, and timing
      description: State what was expected, what happened, the last successful step, and whether it repeats.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Final checks
      options:
        - label: I used the published nfjrom RAM image and did not attempt flash installation.
          required: true
        - label: I reviewed the attached logs and redacted sensitive device-unique data.
          required: true
        - label: I searched existing reports for the same model and revision.
          required: true
